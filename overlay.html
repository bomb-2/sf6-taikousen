<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>対抗戦スコア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@800;900&display=swap" rel="stylesheet">
<style>
  /* OBSブラウザソース：幅 800 / 高さ 112 */
  :root{
    --l:#e63950; --r:#2b7fff;
    --l-ink:#fff; --r-ink:#fff;
    --panel:rgba(12,14,20,.90);
    --panel-2:rgba(24,27,36,.92);
    --line:rgba(255,255,255,.14);
    --muted:rgba(255,255,255,.62);
  }
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  body{
    width:800px;height:112px;position:relative;
    font-family:"M PLUS 1p","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
    color:#fff;-webkit-font-smoothing:antialiased;
  }
  .disp{font-family:"Dela Gothic One","M PLUS 1p","Yu Gothic UI","Meiryo",sans-serif;font-weight:400}

  .bar{
    position:absolute;left:0;top:6px;width:800px;height:70px;
    display:grid;grid-template-columns:190px 74px 1fr 74px 190px;
    clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 100%,0 100%);
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));
  }
  .team{position:relative;display:flex;align-items:center;overflow:hidden;padding:0 14px}
  .team.l{background:linear-gradient(100deg,color-mix(in srgb,var(--l) 78%,#000) 0%,var(--l) 70%);color:var(--l-ink);justify-content:flex-end;padding-left:34px}
  .team.r{background:linear-gradient(260deg,color-mix(in srgb,var(--r) 78%,#000) 0%,var(--r) 70%);color:var(--r-ink);justify-content:flex-start;padding-right:34px}
  .team::after{ /* 斜めのハイライト */
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 2px,transparent 2px 10px);
    pointer-events:none;
  }
  .tname{white-space:nowrap;font-size:26px;line-height:1;letter-spacing:.02em;position:relative;z-index:1;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .team.l .tname{text-align:right}

  .score{
    background:var(--panel);display:grid;place-items:center;position:relative;
    font-size:50px;line-height:1;letter-spacing:-.02em;
    font-variant-numeric:tabular-nums;
  }
  .score.l{box-shadow:inset 4px 0 0 var(--l)}
  .score.r{box-shadow:inset -4px 0 0 var(--r)}
  .score span{display:inline-block;transform-origin:50% 60%}
  .score span.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(1.7);filter:brightness(2.2)}100%{transform:scale(1);filter:none}}
  .team.flash::before{
    content:"";position:absolute;inset:0;background:#fff;z-index:2;
    animation:flash .6s ease-out forwards;
  }
  @keyframes flash{0%{opacity:.75}100%{opacity:0}}

  .center{
    background:var(--panel-2);display:flex;flex-direction:column;justify-content:center;
    align-items:center;min-width:0;padding:0 10px;border-left:1px solid var(--line);border-right:1px solid var(--line);
  }
  .label{font-size:13px;font-weight:900;letter-spacing:.14em;color:var(--muted);white-space:nowrap;line-height:1;margin-bottom:6px}
  .match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;gap:8px}
  .pname{font-size:21px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
  .pname.l{text-align:right;border-right:3px solid var(--l);padding-right:7px}
  .pname.r{text-align:left;border-left:3px solid var(--r);padding-left:7px}
  .vs{font-size:15px;color:var(--muted);line-height:1}
  .title{font-size:22px;white-space:nowrap;overflow:hidden;line-height:1.1;max-width:100%}
  .is-title .match{display:none}
  .is-match .title{display:none}

  .pips{
    position:absolute;top:84px;left:0;width:800px;display:flex;justify-content:center;gap:5px;
  }
  .pip{
    width:24px;height:10px;transform:skewX(-20deg);
    background:rgba(12,14,20,.75);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28);
  }
  .pip.w0{background:var(--l);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25)}
  .pip.w1{background:var(--r);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25)}
  .pip.now{box-shadow:inset 0 0 0 2px #fff;animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{50%{opacity:.45}}
  .pips.hide{display:none}
  .notice{position:absolute;inset:6px 0 auto 0;height:70px;display:none;place-items:center;background:rgba(12,14,20,.9);font-size:15px;font-weight:900;color:#ffd23f;text-align:center;padding:0 20px;box-sizing:border-box}
  .notice.show{display:grid}
</style>
</head>
<body>
  <div class="bar">
    <div class="team l" id="teamL"><div class="tname disp" id="nameL">チームA</div></div>
    <div class="score l disp"><span id="scoreL">0</span></div>
    <div class="center is-title" id="center">
      <div class="label" id="label">第1試合</div>
      <div class="match">
        <div class="pname l" id="pL"></div>
        <div class="vs disp">VS</div>
        <div class="pname r" id="pR"></div>
      </div>
      <div class="title disp" id="title">サーバー対抗戦</div>
    </div>
    <div class="score r disp"><span id="scoreR">0</span></div>
    <div class="team r" id="teamR"><div class="tname disp" id="nameR">チームB</div></div>
  </div>
  <div class="pips" id="pips"></div>
  <div class="notice" id="notice"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const room = (q.get('room') || '').replace(/[^a-z0-9]/gi, '');
  const dbRaw = (q.get('db') || '').trim().replace(/\/+$/, '');
  const DB = !dbRaw ? '' : (dbRaw.includes('://') ? dbRaw : 'https://' + dbRaw);

  const defaults = () => ({
    title: 'サーバー対抗戦', total: 14, showPips: true,
    teams: [
      { name: 'チームA', color: '#e63950', score: 0, roster: [] },
      { name: 'チームB', color: '#2b7fff', score: 0, roster: [] }
    ],
    current: { left: '', right: '', label: '' },
    history: []
  });

  // Firebaseは空配列を消し、配列をオブジェクトで返すことがあるので整える
  const arr = v => Array.isArray(v) ? v.filter(x => x != null) : (v && typeof v === 'object' ? Object.keys(v).sort((a, b) => a - b).map(k => v[k]).filter(x => x != null) : []);
  function normalize(raw) {
    const d = defaults();
    if (!raw || typeof raw !== 'object') return d;
    const teams = arr(raw.teams);
    const s = Object.assign(d, raw);
    s.teams = [0, 1].map(i => Object.assign({}, d.teams[i], teams[i] || {}));
    s.teams.forEach(t => { t.roster = arr(t.roster); t.score = +t.score || 0; });
    s.history = arr(raw.history);
    s.current = Object.assign({ left: '', right: '', label: '' }, raw.current || {});
    return s;
  }

  function notice(msg) {
    const n = $('notice');
    n.textContent = msg || '';
    n.classList.toggle('show', !!msg);
  }

  // 明るい色なら黒文字、暗い色なら白文字
  function ink(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return '#fff';
    const n = parseInt(m[1], 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => {
      v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4);
    });
    return (.2126 * c[0] + .7152 * c[1] + .0722 * c[2]) > .42 ? '#111' : '#fff';
  }

  // はみ出す文字は自動で縮小
  function fit(el, max, min) {
    el.style.fontSize = max + 'px';
    const box = el.parentElement;
    let size = max;
    const avail = () => (el.classList.contains('tname') ? box.clientWidth - 48 : el.clientWidth);
    while (size > min && el.scrollWidth > avail() + 0.5) { size -= 1; el.style.fontSize = size + 'px'; }
  }

  let cur = null;
  function bump(scoreEl, teamEl) {
    scoreEl.classList.remove('pop'); teamEl.classList.remove('flash');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('pop'); teamEl.classList.add('flash');
  }

  function render(s) {
    const prev = cur;
    cur = s;
    const root = document.documentElement.style;
    root.setProperty('--l', s.teams[0].color);
    root.setProperty('--r', s.teams[1].color);
    root.setProperty('--l-ink', ink(s.teams[0].color));
    root.setProperty('--r-ink', ink(s.teams[1].color));

    $('nameL').textContent = s.teams[0].name || '';
    $('nameR').textContent = s.teams[1].name || '';
    fit($('nameL'), 26, 12); fit($('nameR'), 26, 12);

    const sl = s.teams[0].score, sr = s.teams[1].score;
    if (prev && sl > prev.teams[0].score) bump($('scoreL'), $('teamL'));
    if (prev && sr > prev.teams[1].score) bump($('scoreR'), $('teamR'));
    $('scoreL').textContent = sl;
    $('scoreR').textContent = sr;

    const c = s.current;
    const hasMatch = !!(c.left || c.right);
    const center = $('center');
    center.classList.toggle('is-match', hasMatch);
    center.classList.toggle('is-title', !hasMatch);
    $('label').textContent = c.label || ('第' + (s.history.length + 1) + '試合');
    $('label').style.display = hasMatch || c.label ? '' : 'none';
    $('pL').textContent = c.left || '―';
    $('pR').textContent = c.right || '―';
    $('title').textContent = s.title || '';
    if (hasMatch) { fit($('pL'), 21, 10); fit($('pR'), 21, 10); }
    else fit($('title'), 22, 11);

    const pips = $('pips');
    pips.classList.toggle('hide', !s.showPips);
    const total = Math.min(40, Math.max(+s.total || 0, s.history.length + (hasMatch ? 1 : 0)));
    let html = '';
    for (let i = 0; i < total; i++) {
      const h = s.history[i];
      let cls = 'pip';
      if (h) cls += ' w' + h.winner;
      else if (i === s.history.length && hasMatch) cls += ' now';
      html += '<div class="' + cls + '"></div>';
    }
    pips.innerHTML = html;
  }

  render(defaults());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => cur && render(Object.assign({}, cur)));

  if (!DB || !room) { notice('URLが正しくありません。主催から配られたURLをそのまま貼ってください'); return; }

  // ---- Firebase Realtime Database（REST ストリーミング）で受信 ----
  let raw = null;
  function setAt(obj, path, val) {
    const parts = path.split('/').filter(Boolean);
    if (!parts.length) return val;
    const out = (obj && typeof obj === 'object') ? JSON.parse(JSON.stringify(obj)) : {};
    let o = out;
    for (let i = 0; i < parts.length - 1; i++) {
      const p = parts[i];
      if (!o[p] || typeof o[p] !== 'object') o[p] = {};
      o = o[p];
    }
    const last = parts[parts.length - 1];
    if (val === null) delete o[last]; else o[last] = val;
    return out;
  }

  let es = null, retry = null;
  function connect() {
    if (es) es.close();
    es = new EventSource(DB + '/rooms/' + room + '/state.json');
    es.addEventListener('put', e => {
      const m = JSON.parse(e.data);
      raw = setAt(raw, m.path, m.data);
      notice('');
      render(normalize(raw));
    });
    es.addEventListener('patch', e => {
      const m = JSON.parse(e.data);
      Object.keys(m.data || {}).forEach(k => { raw = setAt(raw, m.path.replace(/\/$/, '') + '/' + k, m.data[k]); });
      render(normalize(raw));
    });
    es.addEventListener('cancel', () => notice('読み込みが拒否されました（主催の設定を確認してください）'));
    es.onerror = () => {
      // EventSource は自動で再接続するが、閉じられた場合は手動で張り直す
      if (es.readyState === EventSource.CLOSED) { clearTimeout(retry); retry = setTimeout(connect, 3000); }
    };
  }
  connect();
})();
</script>
</body>
</html>
