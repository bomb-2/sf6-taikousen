<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>対抗戦スコア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@800;900&display=swap" rel="stylesheet">
<style>
  /* OBSブラウザソース：幅 800 / 高さ 112 */
  :root{
    --l:#e63950; --r:#2b7fff;
    --l-ink:#fff; --r-ink:#fff;
    --panel:rgba(12,14,20,.92);
  }
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  body{
    width:800px;height:112px;position:relative;
    font-family:"M PLUS 1p","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
    color:#fff;-webkit-font-smoothing:antialiased;
  }
  .disp{font-family:"Dela Gothic One","M PLUS 1p","Yu Gothic UI","Meiryo",sans-serif;font-weight:400}

  .bar{
    position:absolute;left:0;top:16px;width:800px;height:80px;
    display:grid;grid-template-columns:1fr 66px 20px 66px 1fr;
    clip-path:polygon(24px 0,calc(100% - 24px) 0,100% 100%,0 100%);
  }

  /* 選手（主役） */
  .player{position:relative;display:flex;flex-direction:column;justify-content:center;min-width:0;overflow:hidden}
  .player.l{background:linear-gradient(90deg,color-mix(in srgb,var(--l) 70%,#000) 0%,var(--l) 100%);color:var(--l-ink);align-items:flex-end;padding:0 14px 0 32px}
  .player.r{background:linear-gradient(270deg,color-mix(in srgb,var(--r) 70%,#000) 0%,var(--r) 100%);color:var(--r-ink);align-items:flex-start;padding:0 32px 0 14px}
  .tname{
    font-size:12px;font-weight:900;letter-spacing:.08em;line-height:1;opacity:.82;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-bottom:5px;
  }
  .pname{
    font-size:34px;font-weight:900;line-height:1.1;white-space:nowrap;max-width:100%;
    text-shadow:0 2px 0 rgba(0,0,0,.28);
  }
  .player.l .pname{text-align:right}
  .pname.none{opacity:.45}
  .pname.wrap{
    white-space:normal;line-height:1.15;word-break:break-all;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
    max-height:2.3em;
  }
  .player.flash::after{
    content:"";position:absolute;inset:0;background:#fff;
    animation:flash .6s ease-out forwards;pointer-events:none;
  }
  @keyframes flash{0%{opacity:.7}100%{opacity:0}}

  /* スコア */
  .score{
    background:var(--panel);display:grid;place-items:center;
    font-size:44px;line-height:1;font-variant-numeric:tabular-nums;
  }
  .score.l{box-shadow:inset 3px 0 0 var(--l)}
  .score.r{box-shadow:inset -3px 0 0 var(--r)}
  .score span{display:inline-block;transform-origin:50% 60%}
  .score span.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(1.7);filter:brightness(2.2)}100%{transform:scale(1);filter:none}}
  .dash{background:var(--panel);display:grid;place-items:center;color:rgba(255,255,255,.5);font-size:20px}

  /* 任意の見出し（大将戦など）。空欄なら出さない */
  .label{
    position:absolute;left:50%;top:0;transform:translateX(-50%);
    background:#fff;color:#111;font-size:12px;font-weight:900;letter-spacing:.1em;
    padding:2px 12px;line-height:1.2;white-space:nowrap;display:none;
    clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 100%,0 100%);
  }
  .label.show{display:block}

  .notice{position:absolute;left:0;top:16px;width:800px;height:80px;display:none;place-items:center;background:rgba(12,14,20,.92);font-size:15px;font-weight:900;color:#ffd23f;text-align:center;padding:0 20px;box-sizing:border-box}
  .notice.show{display:grid}
</style>
</head>
<body>
  <div class="bar">
    <div class="player l" id="plL">
      <div class="tname" id="nameL">チームA</div>
      <div class="pname" id="pL">―</div>
    </div>
    <div class="score l disp"><span id="scoreL">0</span></div>
    <div class="dash disp">-</div>
    <div class="score r disp"><span id="scoreR">0</span></div>
    <div class="player r" id="plR">
      <div class="tname" id="nameR">チームB</div>
      <div class="pname" id="pR">―</div>
    </div>
  </div>
  <div class="label" id="label"></div>
  <div class="notice" id="notice"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const room = (q.get('room') || '').replace(/[^a-z0-9]/gi, '');
  const dbRaw = (q.get('db') || '').trim().replace(/\/+$/, '');
  const DB = !dbRaw ? '' : (dbRaw.includes('://') ? dbRaw : 'https://' + dbRaw);

  const defaults = () => ({
    title: 'サーバー対抗戦',
    teams: [
      { name: 'チームA', color: '#e63950', score: 0, roster: [] },
      { name: 'チームB', color: '#2b7fff', score: 0, roster: [] }
    ],
    current: { left: '', right: '', label: '' },
    history: []
  });

  // Firebaseは空配列を消し、配列をオブジェクトで返すことがあるので整える
  const arr = v => Array.isArray(v) ? v.filter(x => x != null) : (v && typeof v === 'object' ? Object.keys(v).sort((a, b) => a - b).map(k => v[k]).filter(x => x != null) : []);
  function normalize(raw) {
    const d = defaults();
    if (!raw || typeof raw !== 'object') return d;
    const teams = arr(raw.teams);
    const s = Object.assign(d, raw);
    s.teams = [0, 1].map(i => Object.assign({}, d.teams[i], teams[i] || {}));
    s.teams.forEach(t => { t.roster = arr(t.roster); t.score = +t.score || 0; });
    s.history = arr(raw.history);
    s.current = Object.assign({ left: '', right: '', label: '' }, raw.current || {});
    return s;
  }

  function notice(msg) {
    const n = $('notice');
    n.textContent = msg || '';
    n.classList.toggle('show', !!msg);
  }

  // 明るい色なら黒文字、暗い色なら白文字
  function ink(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return '#fff';
    const n = parseInt(m[1], 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => {
      v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4);
    });
    return (.2126 * c[0] + .7152 * c[1] + .0722 * c[2]) > .42 ? '#111' : '#fff';
  }

  // はみ出す名前は自動で縮小。それでも入らなければ2行にする
  function fit(el, max, min) {
    const avail = el.parentElement.clientWidth - 46;
    el.style.maxWidth = avail + 'px';
    el.classList.remove('wrap');
    let size = max;
    el.style.fontSize = size + 'px';
    while (size > min && el.scrollWidth > avail) { size -= 1; el.style.fontSize = size + 'px'; }
    if (el.scrollWidth <= avail) return;
    el.classList.add('wrap');
    size = 21;
    el.style.fontSize = size + 'px';
    while (size > 11 && el.scrollHeight > el.clientHeight + 1) { size -= 1; el.style.fontSize = size + 'px'; }
  }

  let cur = null;
  function bump(scoreEl, playerEl) {
    scoreEl.classList.remove('pop'); playerEl.classList.remove('flash');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('pop'); playerEl.classList.add('flash');
  }

  function render(s) {
    const prev = cur;
    cur = s;
    const root = document.documentElement.style;
    root.setProperty('--l', s.teams[0].color);
    root.setProperty('--r', s.teams[1].color);
    root.setProperty('--l-ink', ink(s.teams[0].color));
    root.setProperty('--r-ink', ink(s.teams[1].color));

    $('nameL').textContent = s.teams[0].name || '';
    $('nameR').textContent = s.teams[1].name || '';

    const sl = s.teams[0].score, sr = s.teams[1].score;
    if (prev && sl > prev.teams[0].score) bump($('scoreL'), $('plL'));
    if (prev && sr > prev.teams[1].score) bump($('scoreR'), $('plR'));
    $('scoreL').textContent = sl;
    $('scoreR').textContent = sr;

    const c = s.current;
    [['pL', c.left], ['pR', c.right]].forEach(([id, name]) => {
      const el = $(id);
      el.textContent = name || '―';
      el.classList.toggle('none', !name);
      fit(el, 34, 18);
    });

    $('label').textContent = c.label || '';
    $('label').classList.toggle('show', !!c.label);
  }

  render(defaults());
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => cur && render(Object.assign({}, cur)));

  if (!DB || !room) { notice('URLが正しくありません。主催から配られたURLをそのまま貼ってください'); return; }

  // ---- Firebase Realtime Database（REST ストリーミング）で受信 ----
  let raw = null;
  function setAt(obj, path, val) {
    const parts = path.split('/').filter(Boolean);
    if (!parts.length) return val;
    const out = (obj && typeof obj === 'object') ? JSON.parse(JSON.stringify(obj)) : {};
    let o = out;
    for (let i = 0; i < parts.length - 1; i++) {
      const p = parts[i];
      if (!o[p] || typeof o[p] !== 'object') o[p] = {};
      o = o[p];
    }
    const last = parts[parts.length - 1];
    if (val === null) delete o[last]; else o[last] = val;
    return out;
  }

  let es = null, retry = null;
  function connect() {
    if (es) es.close();
    es = new EventSource(DB + '/rooms/' + room + '/state.json');
    es.addEventListener('put', e => {
      const m = JSON.parse(e.data);
      raw = setAt(raw, m.path, m.data);
      notice('');
      render(normalize(raw));
    });
    es.addEventListener('patch', e => {
      const m = JSON.parse(e.data);
      Object.keys(m.data || {}).forEach(k => { raw = setAt(raw, m.path.replace(/\/$/, '') + '/' + k, m.data[k]); });
      render(normalize(raw));
    });
    es.addEventListener('cancel', () => notice('読み込みが拒否されました（主催の設定を確認してください）'));
    es.onerror = () => {
      // EventSource は自動で再接続するが、閉じられた場合は手動で張り直す
      if (es.readyState === EventSource.CLOSED) { clearTimeout(retry); retry = setTimeout(connect, 3000); }
    };
  }
  connect();
})();
</script>
</body>
</html>
