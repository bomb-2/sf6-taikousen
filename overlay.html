<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>対抗戦スコア</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root{--l:#e63950;--r:#2b7fff;--l-ink:#fff;--r-ink:#fff;--panel:rgba(12,14,20,.92);--panel-2:rgba(22,25,34,.92)}
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  body{position:relative;font-family:"M PLUS 1p","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
  .disp{font-family:"Dela Gothic One","M PLUS 1p","Yu Gothic UI","Meiryo",sans-serif;font-weight:400}
  .fit{white-space:nowrap;line-height:1.1}
  .fit.clip{overflow:hidden;text-overflow:ellipsis}
  .fit.wrap{white-space:normal;line-height:1.15;word-break:break-all;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;max-height:2.3em}
  .pname{font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.28)}
  .pname.none{opacity:.45}
  .score{display:grid;place-items:center;line-height:1;font-variant-numeric:tabular-nums;background:var(--panel)}
  .score span{display:inline-block;transform-origin:50% 60%}
  .score span.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(1.7);filter:brightness(2.2)}100%{transform:scale(1);filter:none}}
  .flash{position:relative}
  .flash::after{content:"";position:absolute;inset:0;background:#fff;animation:flash .6s ease-out forwards;pointer-events:none}
  @keyframes flash{0%{opacity:.7}100%{opacity:0}}
  .label{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#fff;color:#111;font-size:13px;font-weight:900;letter-spacing:.1em;padding:2px 14px;line-height:1.2;white-space:nowrap;display:none;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 100%,0 100%);z-index:3}
  .label.show{display:block}
  .notice{position:absolute;inset:0;display:none;place-items:center;background:rgba(12,14,20,.92);font-size:15px;font-weight:900;color:#ffd23f;text-align:center;padding:0 20px;box-sizing:border-box;z-index:5}
  .notice.show{display:grid}
  /* C案「チーム名タブ」：OBSブラウザソース 幅 800 / 高さ 124 */
  body{width:800px;height:124px}
  .tabs{position:absolute;left:0;top:14px;width:800px;height:34px;display:flex;justify-content:space-between;padding:0 24px;box-sizing:border-box;pointer-events:none}
  .tab{width:296px;height:34px;display:flex;align-items:center;background:var(--panel);padding:0 16px;box-sizing:border-box;min-width:0}
  .tab.l{justify-content:flex-end;clip-path:polygon(14px 0,100% 0,100% 100%,0 100%);box-shadow:inset 0 -3px 0 var(--l)}
  .tab.r{justify-content:flex-start;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 100%,0 100%);box-shadow:inset 0 -3px 0 var(--r)}
  .tab.l .tname{text-align:right}
  .tname{letter-spacing:.04em}
  .bar{position:absolute;left:0;top:48px;width:800px;height:74px;display:grid;
    grid-template-columns:1fr 70px 20px 70px 1fr;
    clip-path:polygon(0 0,100% 0,calc(100% - 24px) 100%,24px 100%)}
  .player{display:flex;align-items:center;min-width:0}
  .player.l{background:linear-gradient(90deg,color-mix(in srgb,var(--l) 70%,#000),var(--l));color:var(--l-ink);justify-content:flex-end;padding:0 14px 0 36px}
  .player.r{background:linear-gradient(270deg,color-mix(in srgb,var(--r) 70%,#000),var(--r));color:var(--r-ink);justify-content:flex-start;padding:0 36px 0 14px}
  .player.l .pname{text-align:right}
  .score{font-size:46px}
  .dash{background:var(--panel);display:grid;place-items:center;color:rgba(255,255,255,.5);font-size:20px}
  .label{top:14px;height:auto}
</style>
</head>
<body>
  <div class="tabs">
    <div class="tab l"><div class="tname fit disp" id="nameL" data-max="21" data-min="12">チームA</div></div>
    <div class="tab r"><div class="tname fit disp" id="nameR" data-max="21" data-min="12">チームB</div></div>
  </div>
  <div class="bar">
    <div class="player l" id="plL"><div class="pname fit" id="pL" data-max="34" data-min="18" data-wrap="21">―</div></div>
    <div class="score l disp"><span id="scoreL">0</span></div>
    <div class="dash disp">-</div>
    <div class="score r disp"><span id="scoreR">0</span></div>
    <div class="player r" id="plR"><div class="pname fit" id="pR" data-max="34" data-min="18" data-wrap="21">―</div></div>
  </div>
  <div class="label" id="label"></div>
  <div class="notice" id="notice"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const room = (q.get('room') || '').replace(/[^a-z0-9]/gi, '');
  const dbRaw = (q.get('db') || '').trim().replace(/\/+$/, '');
  const DB = !dbRaw ? '' : (dbRaw.includes('://') ? dbRaw : 'https://' + dbRaw);

  const defaults = () => ({
    title: 'サーバー対抗戦',
    teams: [
      { name: 'チームA', color: '#e63950', score: 0, roster: [] },
      { name: 'チームB', color: '#2b7fff', score: 0, roster: [] }
    ],
    current: { left: '', right: '', label: '' },
    history: []
  });

  // Firebaseは空配列を消し、配列をオブジェクトで返すことがあるので整える
  const arr = v => Array.isArray(v) ? v.filter(x => x != null) : (v && typeof v === 'object' ? Object.keys(v).sort((a, b) => a - b).map(k => v[k]).filter(x => x != null) : []);
  function normalize(raw) {
    const d = defaults();
    if (!raw || typeof raw !== 'object') return d;
    const teams = arr(raw.teams);
    const s = Object.assign(d, raw);
    s.teams = [0, 1].map(i => Object.assign({}, d.teams[i], teams[i] || {}));
    s.teams.forEach(t => { t.roster = arr(t.roster); t.score = +t.score || 0; });
    s.history = arr(raw.history);
    s.current = Object.assign({ left: '', right: '', label: '' }, raw.current || {});
    return s;
  }

  function notice(msg) {
    const n = $('notice');
    n.textContent = msg || '';
    n.classList.toggle('show', !!msg);
  }

  // 明るい色なら黒文字、暗い色なら白文字
  function ink(hex) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return '#fff';
    const n = parseInt(m[1], 16);
    const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => {
      v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4);
    });
    return (.2126 * c[0] + .7152 * c[1] + .0722 * c[2]) > .42 ? '#111' : '#fff';
  }

  // はみ出す文字は自動で縮小。選手名は入らなければ2行に
  function fit(el) {
    const max = +el.dataset.max || 30, min = +el.dataset.min || 14, wrapMax = +el.dataset.wrap || 0;
    const p = el.parentElement, cs = getComputedStyle(p);
    const avail = p.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    el.style.maxWidth = avail + 'px';
    el.classList.remove('wrap', 'clip');
    let size = max;
    el.style.fontSize = size + 'px';
    while (size > min && el.scrollWidth > avail) { size -= 1; el.style.fontSize = size + 'px'; }
    if (el.scrollWidth <= avail) return;
    if (!wrapMax) { el.classList.add('clip'); return; }
    el.classList.add('wrap');
    size = wrapMax;
    el.style.fontSize = size + 'px';
    while (size > 10 && el.scrollHeight > el.clientHeight + 1) { size -= 1; el.style.fontSize = size + 'px'; }
  }

  // フォントごとの上下の余白の偏りを測って、文字の見た目を枠の中央にそろえる
  const ctx2d = document.createElement('canvas').getContext('2d');
  function vcenter(el) {
    el.style.top = '';
    const text = (el.textContent || '').trim();
    if (!text) return;
    const cs = getComputedStyle(el);
    ctx2d.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    const m = ctx2d.measureText(text);
    if (!m.fontBoundingBoxAscent && !m.fontBoundingBoxDescent) return;
    const off = (m.fontBoundingBoxAscent - m.fontBoundingBoxDescent) / 2
              - (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
    el.style.position = 'relative';
    el.style.top = (-off).toFixed(1) + 'px';
  }

  let cur = null;
  function bump(scoreEl, playerEl) {
    scoreEl.classList.remove('pop'); playerEl.classList.remove('flash');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('pop'); playerEl.classList.add('flash');
  }

  function render(s) {
    const prev = cur;
    cur = s;
    const root = document.documentElement.style;
    root.setProperty('--l', s.teams[0].color);
    root.setProperty('--r', s.teams[1].color);
    root.setProperty('--l-ink', ink(s.teams[0].color));
    root.setProperty('--r-ink', ink(s.teams[1].color));

    $('nameL').textContent = s.teams[0].name || '';
    $('nameR').textContent = s.teams[1].name || '';
    fit($('nameL')); fit($('nameR')); vcenter($('nameL')); vcenter($('nameR'));

    const sl = s.teams[0].score, sr = s.teams[1].score;
    if (prev && sl > prev.teams[0].score) bump($('scoreL'), $('plL'));
    if (prev && sr > prev.teams[1].score) bump($('scoreR'), $('plR'));
    $('scoreL').textContent = sl;
    $('scoreR').textContent = sr;
    vcenter($('scoreL')); vcenter($('scoreR'));

    const c = s.current;
    [['pL', c.left], ['pR', c.right]].forEach(([id, name]) => {
      const el = $(id);
      el.textContent = name || '―';
      el.classList.toggle('none', !name);
      fit(el); vcenter(el);
    });

    $('label').textContent = c.label || '';
    $('label').classList.toggle('show', !!c.label);
  }

  render(defaults());
  if (document.fonts) {
    const again = () => cur && render(Object.assign({}, cur));
    if (document.fonts.ready) document.fonts.ready.then(again);
    document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', again);
  }

  if (q.get('demo')) {
    const long = q.get('demo') === 'long';
    render(normalize({
      title: 'サーバー対抗戦',
      teams: [{ name: q.get('tl') || 'ダルシム部', color: '#e63950', score: 3 }, { name: q.get('tr') || '希構', color: '#2b7fff', score: 2 }],
      current: long ? { left: 'DIO_Brando99', right: 'とてもとても長い名前のプレイヤーさん＠所属サーバー', label: '大将戦' } : { left: 'かやの', right: 'まりゅめろ', label: '' }
    }));
    return;
  }

  if (!DB || !room) { notice('URLが正しくありません。主催から配られたURLをそのまま貼ってください'); return; }

  // ---- Firebase Realtime Database（REST ストリーミング）で受信 ----
  let raw = null;
  function setAt(obj, path, val) {
    const parts = path.split('/').filter(Boolean);
    if (!parts.length) return val;
    const out = (obj && typeof obj === 'object') ? JSON.parse(JSON.stringify(obj)) : {};
    let o = out;
    for (let i = 0; i < parts.length - 1; i++) {
      const p = parts[i];
      if (!o[p] || typeof o[p] !== 'object') o[p] = {};
      o = o[p];
    }
    const last = parts[parts.length - 1];
    if (val === null) delete o[last]; else o[last] = val;
    return out;
  }

  let es = null, retry = null;
  function connect() {
    if (es) es.close();
    es = new EventSource(DB + '/rooms/' + room + '/state.json');
    es.addEventListener('put', e => {
      const m = JSON.parse(e.data);
      raw = setAt(raw, m.path, m.data);
      notice('');
      render(normalize(raw));
    });
    es.addEventListener('patch', e => {
      const m = JSON.parse(e.data);
      Object.keys(m.data || {}).forEach(k => { raw = setAt(raw, m.path.replace(/\/$/, '') + '/' + k, m.data[k]); });
      render(normalize(raw));
    });
    es.addEventListener('cancel', () => notice('読み込みが拒否されました（主催の設定を確認してください）'));
    es.onerror = () => {
      // EventSource は自動で再接続するが、閉じられた場合は手動で張り直す
      if (es.readyState === EventSource.CLOSED) { clearTimeout(retry); retry = setTimeout(connect, 3000); }
    };
  }
  connect();
})();
</script>
</body>
</html>
